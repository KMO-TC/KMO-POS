name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Export web build
        env:
          GITHUB_PAGES_BASE_URL: /KMO-POS
          EXPO_PUBLIC_SUPABASE_URL: https://qjzlcbjqrkcykkmxycjc.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_okxVUPkjjqEwvGPxkYyb0A_-a0PSKIw
          NEXT_PUBLIC_SUPABASE_URL: https://qjzlcbjqrkcykkmxycjc.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_okxVUPkjjqEwvGPxkYyb0A_-a0PSKIw
        run: npx expo export --platform web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
```[cite: 1, 9]

အဲဒီအတိုင်း ပြင်ပြီး **Commit changes** နှိပ်ပါ[cite: 1]။ **Actions** tab မှာ run အသစ် `Success` (အစိမ်းရောင်) ဖြစ်သွားတဲ့အထိ စောင့်ပြီး `[https://kmo-tc.github.io/KMO-POS/](https://kmo-tc.github.io/KMO-POS/)` ကို `Ctrl + Shift + R` နဲ့ ပြန်ဖွင့်ကြည့်လိုက်ပါ[cite: 3, 4]။

